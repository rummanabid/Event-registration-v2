<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="sq">
      <rect x="8" y="8" width="184" height="184"/>
    </clipPath>
  </defs>
  <!-- Fan lines radiating from bottom-left corner, clipped to square -->
  <g clip-path="url(#sq)" stroke="currentColor" stroke-width="7" fill="none" stroke-linecap="butt">
    <line x1="8" y1="192" x2="8"   y2="8"/>
    <line x1="8" y1="192" x2="29"  y2="8"/>
    <line x1="8" y1="192" x2="52"  y2="8"/>
    <line x1="8" y1="192" x2="76"  y2="8"/>
    <line x1="8" y1="192" x2="100" y2="8"/>
    <line x1="8" y1="192" x2="124" y2="8"/>
    <line x1="8" y1="192" x2="148" y2="8"/>
    <line x1="8" y1="192" x2="170" y2="8"/>
    <line x1="8" y1="192" x2="192" y2="8"/>
    <line x1="8" y1="192" x2="192" y2="30"/>
    <line x1="8" y1="192" x2="192" y2="60"/>
    <line x1="8" y1="192" x2="192" y2="92"/>
    <line x1="8" y1="192" x2="192" y2="124"/>
    <line x1="8" y1="192" x2="192" y2="156"/>
    <line x1="8" y1="192" x2="192" y2="192"/>
  </g>
  <!-- Square border -->
  <rect x="8" y="8" width="184" height="184" fill="none" stroke="currentColor" stroke-width="8"/>
</svg>
